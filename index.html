<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soda Pop</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        .soda-can {
            width: 150px;
            height: 250px;
            background-color: #c0c0c0; /* Silver color for the can */
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
        }
        .soda-can::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20%;
            background-color: #a0a0a0; /* Top rim */
            border-radius: 10px 10px 0 0;
        }
        .soda-can::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 10%;
            background-color: #a0a0a0; /* Bottom rim */
            border-radius: 0 0 10px 10px;
        }
        .label {
            position: absolute;
            top: 20%;
            left: 0;
            width: 100%;
            height: 70%;
            background-color: #ff0000; /* Red label */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="soda-can">
        <div class="label">SODA POP</div>
    </div>
</body>
</html>
